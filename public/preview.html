<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ella Device Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap">
<style>
  :root {
    --bg: #eef0f3;
    --bg-dot: #d9dde3;
    --bar: rgba(255, 255, 255, 0.85);
    --bar-border: #dde1e6;
    --text: #1b1f24;
    --muted: #616a75;
    --seg-bg: #e3e6ea;
    --seg-active: #ffffff;
    --seg-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    --frame: #16181b;
    --frame-edge: #3a3e44;
    --screen: #ffffff;
    --accent: #208aef;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1114;
      --bg-dot: #1d2026;
      --bar: rgba(22, 24, 28, 0.85);
      --bar-border: #262a31;
      --text: #e8eaed;
      --muted: #9aa3ad;
      --seg-bg: #22262c;
      --seg-active: #363b43;
      --seg-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      --frame: #050506;
      --frame-edge: #2c3036;
      --screen: #000000;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1114;
    --bg-dot: #1d2026;
    --bar: rgba(22, 24, 28, 0.85);
    --bar-border: #262a31;
    --text: #e8eaed;
    --muted: #9aa3ad;
    --seg-bg: #22262c;
    --seg-active: #363b43;
    --seg-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    --frame: #050506;
    --frame-edge: #2c3036;
    --screen: #000000;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--bar);
    border-bottom: 1px solid var(--bar-border);
    backdrop-filter: blur(12px);
    flex-wrap: wrap;
  }
  .title { font-weight: 600; }
  .title span { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .spacer { flex: 1; }

  .seg {
    display: inline-flex;
    padding: 3px;
    border-radius: 10px;
    background: var(--seg-bg);
  }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 7px;
    cursor: pointer;
  }
  .seg button[aria-checked="true"] {
    background: var(--seg-active);
    color: var(--text);
    box-shadow: var(--seg-shadow);
  }
  .seg button:focus-visible, .icon-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .icon-btn {
    appearance: none;
    border: 1px solid var(--bar-border);
    background: transparent;
    color: var(--text);
    font: inherit;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
  }
  .icon-btn:hover { background: var(--seg-bg); }

  .screen-pick {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
  }
  .screen-pick select {
    font: inherit;
    color: var(--text);
    background: var(--seg-bg);
    border: 1px solid var(--bar-border);
    border-radius: 8px;
    padding: 5px 8px;
    cursor: pointer;
  }
  .screen-pick[hidden] { display: none; }
  .screen-pick select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 24px 16px;
  }

  .device-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .device-wrap[hidden] { display: none; }
  .label { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* The slot holds the scaled footprint; the device inside is drawn at real size. */
  .slot { position: relative; }
  .device {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    background: var(--frame);
    box-shadow:
      inset 0 0 0 2px var(--frame-edge),
      0 24px 60px rgba(0, 0, 0, 0.25),
      0 4px 12px rgba(0, 0, 0, 0.15);
  }
  .screen {
    position: absolute;
    overflow: hidden;
    background: var(--screen);
  }
  .screen iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: var(--screen);
  }

  .phone { width: 417px; height: 876px; border-radius: 64px; }
  .phone .screen { inset: 12px; border-radius: 52px; }

  /* iOS status bar and home indicator, from the Figma StatusBar / HomeIndicator components. */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 47px;
    z-index: 2;
    pointer-events: none;
  }
  .status-bar .notch {
    position: absolute;
    top: 0;
    left: 50%;
    width: 172px;
    height: 32px;
    transform: translateX(-50%);
  }
  .status-bar .time {
    position: absolute;
    top: 15px;
    left: calc(16.67% - 11px);
    width: 54px;
    transform: translateX(-50%);
    font: 600 16px/21px Inter, system-ui, sans-serif;
    letter-spacing: -0.32px;
    text-align: center;
    color: #000;
  }
  .status-bar .right {
    position: absolute;
    top: 19px;
    left: calc(83.33% - 0.3px);
    width: 77.401px;
    height: 13px;
    transform: translateX(-50%);
  }
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    width: 134px;
    height: 5px;
    margin-left: -67px;
    border-radius: 100px;
    background: #000;
    z-index: 2;
    pointer-events: none;
  }

  .tablet { width: 856px; height: 1216px; border-radius: 44px; }
  .tablet .screen { inset: 18px; border-radius: 26px; }
  .tablet .camera {
    position: absolute;
    top: 7px;
    left: 50%;
    width: 6px;
    height: 6px;
    margin-left: -3px;
    border-radius: 50%;
    background: #222;
    z-index: 2;
  }
</style>
</head>
<body>
  <header>
    <div class="title">Ella<span>device preview</span></div>
    <div class="seg" id="device-seg" role="radiogroup" aria-label="Device">
      <button role="radio" data-mode="mobile">Mobile</button>
      <button role="radio" data-mode="tablet">Tablet</button>
      <button role="radio" data-mode="both">Both</button>
    </div>
    <label class="screen-pick">Screen
      <select id="screen">
        <option value="/">Start of app (login)</option>
        <option value="/login">Login</option>
        <option value="/verify?email=john.smith@mayo.edu">Enter code (OTP)</option>
        <option value="/scan">QR scanner</option>
        <option value="/welcome?email=john.smith@mayo.edu">Welcome / permissions</option>
        <option value="home">Home</option>
        <option value="/privacy">Privacy Policy</option>
      </select>
    </label>
    <label class="screen-pick" id="variant-pick" hidden>Variant
      <select id="variant">
        <option value="empty">Not synced</option>
        <option value="syncing">Syncing</option>
        <option value="list">Visit list</option>
        <option value="expanded">Sheet expanded</option>
      </select>
    </label>
    <div class="spacer"></div>
    <button class="icon-btn" id="reload" type="button">Reload</button>
    <a class="icon-btn" id="open-app" href="/" target="_blank" rel="noopener">Open app</a>
  </header>

  <main id="stage">
    <div class="device-wrap" id="phone-wrap">
      <div class="slot">
        <div class="device phone">
          <div class="screen">
            <iframe title="Mobile preview" src="/" allow="camera"></iframe>
            <div class="status-bar" aria-hidden="true">
              <img class="notch" src="preview-assets/notch.svg" alt="">
              <div class="time">9:41</div>
              <img class="right" src="preview-assets/status-right.svg" alt="">
            </div>
            <div class="home-indicator" aria-hidden="true"></div>
          </div>
        </div>
      </div>
      <div class="label">iPhone · 393 × 852</div>
    </div>
    <div class="device-wrap" id="tablet-wrap">
      <div class="slot">
        <div class="device tablet">
          <div class="camera"></div>
          <div class="screen"><iframe title="Tablet preview" src="/" allow="camera"></iframe></div>
        </div>
      </div>
      <div class="label">iPad · 820 × 1180</div>
    </div>
  </main>

<script>
  const stage = document.getElementById('stage');
  const wraps = {
    mobile: document.getElementById('phone-wrap'),
    tablet: document.getElementById('tablet-wrap'),
  };
  const sizes = { mobile: [417, 876], tablet: [856, 1216] };
  const buttons = [...document.querySelectorAll('#device-seg button')];
  const modes = ['mobile', 'tablet', 'both'];
  const GAP = 48;
  const LABEL = 28;
  let mode = 'both';

  try {
    const saved = location.hash.slice(1) || localStorage.getItem('ella-preview-mode');
    if (modes.includes(saved)) mode = saved;
  } catch {}

  function visible() {
    return mode === 'both' ? ['mobile', 'tablet'] : [mode];
  }

  function layout() {
    const shown = visible();
    const cs = getComputedStyle(stage);
    const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - LABEL;
    const totalW = shown.reduce((w, k) => w + sizes[k][0], 0) + GAP * (shown.length - 1);
    const maxH = Math.max(...shown.map(k => sizes[k][1]));
    const scale = Math.min(1, (availW - GAP * (shown.length - 1)) / (totalW - GAP * (shown.length - 1)), availH / maxH);

    for (const key of Object.keys(wraps)) {
      const wrap = wraps[key];
      wrap.hidden = !shown.includes(key);
      const [w, h] = sizes[key];
      const slot = wrap.querySelector('.slot');
      slot.style.width = w * scale + 'px';
      slot.style.height = h * scale + 'px';
      wrap.querySelector('.device').style.transform = `scale(${scale})`;
    }
  }

  function setMode(next) {
    mode = next;
    buttons.forEach(b => {
      const on = b.dataset.mode === mode;
      b.setAttribute('aria-checked', on);
      b.tabIndex = on ? 0 : -1;
    });
    try { localStorage.setItem('ella-preview-mode', mode); } catch {}
    history.replaceState(null, '', '#' + mode);
    layout();
  }

  buttons.forEach(b => {
    b.addEventListener('click', () => setMode(b.dataset.mode));
    b.addEventListener('keydown', e => {
      const dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!dir) return;
      e.preventDefault();
      const next = modes[(modes.indexOf(mode) + dir + modes.length) % modes.length];
      setMode(next);
      buttons[modes.indexOf(next)].focus();
    });
  });

  // Screen picker: jump straight to any screen instead of clicking through the flow.
  // Home has variants (the app's ?state= / ?sheet= values), picked with the Variant dropdown.
  const frames = [...document.querySelectorAll('iframe')];
  const screenSelect = document.getElementById('screen');
  const openApp = document.getElementById('open-app');
  const variantPick = document.getElementById('variant-pick');
  const variantSelect = document.getElementById('variant');

  const HOME = 'home';
  const TEST_EMAIL = 'john.smith@mayo.edu';
  const VARIANTS = {
    empty: { state: 'empty' },
    syncing: { state: 'syncing' },
    list: { state: 'list' },
    expanded: { state: 'list', sheet: 'expanded' },
  };
  const variantIds = Object.keys(VARIANTS);
  const DEFAULT_VARIANT = 'list';

  let screen = screenSelect.value;
  let variant = DEFAULT_VARIANT;

  // URL key for a screen: "/verify?email=…" → "verify", "/" → "start", Home → "home".
  function keyOf(value) {
    if (value === HOME) return HOME;
    return value.split('?')[0].slice(1) || 'start';
  }

  // Same paths the old per-variant Home options used, so the app sees identical URLs.
  function homePath(id) {
    const { state, sheet } = VARIANTS[id];
    return `/home?state=${state}${sheet ? `&sheet=${sheet}` : ''}&email=${TEST_EMAIL}`;
  }

  function variantFrom(state, sheet) {
    if (sheet === 'expanded') return 'expanded';
    return variantIds.includes(state) ? state : DEFAULT_VARIANT;
  }

  // Accepts the current form (?screen=home&state=list&sheet=expanded), the old nested form
  // (?screen=home%3Fstate%3Dlist%26sheet%3Dexpanded) and bare keys like ?screen=verify.
  function resolve(raw, state, sheet) {
    if (!raw) return null;
    let key = raw;
    if (raw.includes('?')) {
      const [k, rest] = raw.split('?');
      const inner = new URLSearchParams(rest);
      key = k;
      state = state || inner.get('state');
      sheet = sheet || inner.get('sheet');
    }
    key = key.replace(/^\//, '');
    if (key === HOME) return { screen: HOME, variant: variantFrom(state, sheet) };
    const option =
      [...screenSelect.options].find(o => keyOf(o.value) === (key || 'start')) ||
      [...screenSelect.options].find(o => o.value.startsWith('/' + key));
    return option ? { screen: option.value, variant } : null;
  }

  function render() {
    const isHome = screen === HOME;
    const path = isHome ? homePath(variant) : screen;

    screenSelect.value = screen;
    variantPick.hidden = !isHome;
    variantSelect.value = variant;

    frames.forEach(f => { f.src = path; });
    openApp.href = path;

    const query = new URLSearchParams({ screen: keyOf(screen) });
    if (isHome) {
      const { state, sheet } = VARIANTS[variant];
      query.set('state', state);
      if (sheet) query.set('sheet', sheet);
    }
    history.replaceState(null, '', `?${query}${location.hash}`);

    try {
      localStorage.setItem('ella-preview-screen', screen);
      localStorage.setItem('ella-preview-variant', variant);
    } catch {}
  }

  // A link wins; otherwise reuse the last screen and variant picked.
  const params = new URLSearchParams(location.search);
  let initial = resolve(params.get('screen'), params.get('state'), params.get('sheet'));
  if (!initial) {
    try {
      const saved = localStorage.getItem('ella-preview-screen');
      const savedVariant = localStorage.getItem('ella-preview-variant');
      if (saved === HOME) {
        initial = { screen: HOME, variant: variantIds.includes(savedVariant) ? savedVariant : DEFAULT_VARIANT };
      } else if (saved && saved.startsWith('/home')) {
        // Older saves stored full Home paths like "/home?state=list&…".
        const q = new URLSearchParams(saved.split('?')[1]);
        initial = { screen: HOME, variant: variantFrom(q.get('state'), q.get('sheet')) };
      } else if ([...screenSelect.options].some(o => o.value === saved)) {
        initial = { screen: saved, variant: DEFAULT_VARIANT };
      }
    } catch {}
  }
  if (initial) ({ screen, variant } = initial);
  render();

  screenSelect.addEventListener('change', () => {
    screen = screenSelect.value;
    if (screen === HOME) variant = DEFAULT_VARIANT;
    render();
  });

  variantSelect.addEventListener('change', () => {
    variant = variantSelect.value;
    render();
  });

  // Reloads whatever screen each frame is on now, even after navigating inside the app.
  document.getElementById('reload').addEventListener('click', () => {
    frames.forEach(f => {
      try { f.contentWindow.location.reload(); } catch { f.src = f.src; }
    });
  });

  window.addEventListener('hashchange', () => {
    const next = location.hash.slice(1);
    if (modes.includes(next) && next !== mode) setMode(next);
  });

  new ResizeObserver(layout).observe(stage);
  setMode(mode);
</script>
</body>
</html>
