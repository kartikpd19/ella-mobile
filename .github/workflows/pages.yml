# Publishes the web build and device preview to GitHub Pages on every push to main.
# Live at https://kartikpd19.github.io/ella-mobile/preview.html
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo export -p web
        env:
          EXPO_BASE_URL: /ella-mobile
      # Unknown paths get the app's not-found screen; .nojekyll keeps the _expo folder.
      - run: cp "dist/+not-found.html" dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview.html
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
